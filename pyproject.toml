[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ieeval"
version = "0.1.0"
description = "Reproducible evaluation and diagnostics for embedding-backed retrieval systems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "ieepirzy", email = "nervy_colder_1m@icloud.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/ieepirzy/ieeVal"
Repository = "https://github.com/ieepirzy/ieeVal"
Issues = "https://github.com/ieepirzy/ieeVal/issues"

[project.scripts]
ieeval = "ieeval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ieeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["ieeval"]
ignore_missing_imports = true
